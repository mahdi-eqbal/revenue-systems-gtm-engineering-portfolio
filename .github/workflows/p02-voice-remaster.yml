name: P02 voice remaster (one-time)
on:
  push:
    paths:
      - '.github/workflows/p02-voice-remaster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download visuals and natural narration
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 'https://resource2.heygen.ai/video/b1415400b8f54b25900743b87352c302/original.mp4' -o client_visual.mp4
          curl -fLsS --retry 2 'https://resource2.heygen.ai/video/bfe54414055a4f6bb8f03c336405800d/original.mp4' -o technical_visual.mp4
          curl -fLsS --retry 2 'https://resource2.heygen.ai/text_to_speech/d14202275ca54b95bc78f8a02842f0cd/776f9d2ff401499a8f1f2bcb4ca46004/id=47430a7cf4f24a56a275ceddc19da5d3.wav' -o client_narration.wav
          curl -fLsS --retry 2 'https://resource2.heygen.ai/text_to_speech/d14202275ca54b95bc78f8a02842f0cd/80b17a1be1594e578b92c0ddf4a37fc8/id=4b12864c98d345f8b4e80457cdc21a0a.wav' -o technical_narration.wav
          for f in client_visual.mp4 technical_visual.mp4 client_narration.wav technical_narration.wav; do test "$(stat -c%s "$f")" -gt 100000 || { echo "Invalid download: $f"; exit 1; }; done
      - name: Render remastered narrated demos at 1080p
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          for prefix in ('client','technical'):
            inp=f'{prefix}_visual.mp4'; aud=f'{prefix}_narration.wav'
            def duration(f):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',f],text=True).strip())
            ratio=duration(aud)/duration(inp)
            print(prefix, 'video',duration(inp), 'narration',duration(aud),'ratio',ratio)
            vf=f'setpts={ratio:.10f}*PTS,scale=1920:1080:flags=lanczos,fps=30,format=yuv420p'
            subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',inp,'-i',aud,'-map','0:v:0','-map','1:a:0','-vf',vf,'-af','loudnorm=I=-16:TP=-1.5:LRA=11','-c:v','libx264','-preset','medium','-crf','20','-c:a','aac','-b:a','192k','-ar','48000','-movflags','+faststart','-shortest',f'P02_{prefix.capitalize()}_New_Natural_Voice_1080p.mp4'],check=True)
          PY
      - name: Verify outputs
        run: |
          set -euo pipefail
          for f in P02_*_New_Natural_Voice_1080p.mp4; do
            test "$(stat -c%s "$f")" -gt 400000
            ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q aac
            ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 "$f" | grep -q '1920,1080'
            echo "PASS $f"
          done
      - name: Upload final MP4s
        uses: actions/upload-artifact@v4
        with:
          name: P02-Updated-Natural-Voice-1080p
          path: P02_*_New_Natural_Voice_1080p.mp4
          retention-days: 30