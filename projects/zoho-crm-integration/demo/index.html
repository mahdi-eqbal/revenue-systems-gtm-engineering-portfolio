<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Lead Integration</title>
<style>
body{font:16px system-ui;color:#182536;background:#f2f5fa;max-width:1100px;margin:3rem auto;padding:0 1rem}
section{background:white;border:1px solid #d8e1ed;border-radius:12px;padding:1.25rem;margin:1rem 0;overflow:auto}
h1,h2{margin-top:0} form{display:grid;gap:.8rem} label{display:grid;gap:.25rem}
.fields{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
input,textarea,button{font:inherit;padding:.55rem;border:1px solid #a5b5c9;border-radius:6px}
button{justify-self:start;background:#174985;color:white;cursor:pointer} table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.55rem;border-bottom:1px solid #d8e1ed;overflow-wrap:anywhere} td{max-width:230px}
</style>
<h1>CRM Lead Integration</h1>
<p>Local demo with synthetic data and a simulated CRM.</p>
<div aria-live="polite">{{result}}</div>
<section><h2>Website lead</h2>
<form action="/lead" method="post">
<input type="hidden" name="submission_id" value="{{submission_id}}">
<div class="fields">
<label>Last name<input name="last_name" required></label>
<label>Company<input name="company" required></label>
<label>Email<input name="email" type="email"></label>
<label>Phone<input name="phone" type="tel"></label>
<label>UTM source<input name="utm_source"></label>
<label>UTM medium<input name="utm_medium"></label>
<label>UTM campaign<input name="utm_campaign"></label>
</div><button>Submit lead</button></form></section>
<section><h2>CSV import</h2>
<form action="/csv/preview" method="post">
<label>CSV file<input type="file" accept=".csv,text/csv" id="file"></label>
<label>CSV preview input<textarea name="csv" id="csv" rows="4" required></textarea></label>
<button>Preview rows</button></form></section>
<section><h2>Processing history</h2>
<table><thead><tr><th>Source</th><th>Result</th><th>Lead ID</th><th>Tracking ID</th><th>Campaign</th><th>UTM</th></tr></thead>
<tbody>{{history}}</tbody></table></section>
<script>
document.querySelector('#file').addEventListener('change',async(event)=>{
  const file=event.target.files[0];
  if(file) document.querySelector('#csv').value=await file.text();
});
</script>
</html>
